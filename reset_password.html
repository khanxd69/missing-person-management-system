<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>MPMS — Reset Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/css/main.css"/>
</head>
<body class="login-page">
  <div class="login-bg"><div class="bg-grid"></div><div class="bg-glow"></div></div>
  <div class="login-container">
    <div class="login-brand">
      <div class="brand-icon"><svg width="48" height="48" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="22" stroke="#e63946" stroke-width="2.5"/><circle cx="24" cy="18" r="6" fill="#e63946"/><path d="M10 38c0-7.7 6.3-14 14-14s14 6.3 14 14" stroke="#e63946" stroke-width="2.5" stroke-linecap="round"/></svg></div>
      <div class="brand-text"><h1>MPMS</h1><p>Reset Your Password</p></div>
    </div>
    <div class="login-card">
      {% if not valid %}
      <div style="text-align:center;padding:20px 0">
        <div style="font-size:48px;margin-bottom:12px">❌</div>
        <h3 style="color:var(--red);margin-bottom:8px">Invalid or Expired Link</h3>
        <p style="color:var(--text-muted);font-size:13px;margin-bottom:20px">This reset link has expired or is invalid.</p>
        <a href="/forgot-password" class="btn-login" style="display:inline-flex;text-decoration:none">Request New Link</a>
      </div>
      {% else %}
      <div class="login-card-header"><h2>Set New Password</h2><p>Choose a strong password</p></div>
      <div id="alert-box" class="alert hidden"></div>
      <div id="success-box" class="hidden" style="text-align:center;padding:20px 0">
        <div style="font-size:48px;margin-bottom:12px">✅</div>
        <h3 style="margin-bottom:8px;font-family:var(--font-heading)">Password Reset!</h3>
        <p style="color:var(--text-muted);font-size:13px;margin-bottom:16px">You can now login with your new password.</p>
        <a href="/login" class="btn-login" style="display:inline-flex;text-decoration:none">Go to Login →</a>
      </div>
      <div id="form-section">
        <div class="form-group">
          <label>New Password</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            <input type="password" id="password" placeholder="Min 8 chars, uppercase, number"/>
          </div>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            <input type="password" id="confirm" placeholder="Repeat password"/>
          </div>
        </div>
        <div class="pw-strength-bar" style="margin-bottom:14px">
          <div id="pw-bar" style="height:4px;border-radius:4px;background:var(--bg4);transition:all 0.3s">
            <div id="pw-fill" style="height:100%;border-radius:4px;width:0;transition:all 0.3s"></div>
          </div>
          <div id="pw-hint" style="font-size:11px;color:var(--text-muted);margin-top:4px"></div>
        </div>
        <button id="submit-btn" class="btn-login">Reset Password</button>
      </div>
      {% endif %}
      <div style="text-align:center;margin-top:16px"><a href="/login" style="font-size:13px;color:var(--text-muted)">← Back to Login</a></div>
    </div>
  </div>
  <script>
    const TOKEN = "{{ token }}";
    document.getElementById('password')?.addEventListener('input', function() {
      const pw = this.value;
      let score = 0;
      if (pw.length >= 8) score++;
      if (/[A-Z]/.test(pw)) score++;
      if (/[a-z]/.test(pw)) score++;
      if (/\d/.test(pw)) score++;
      const colors = ['','#e63946','#f4a261','#ffd60a','#2a9d8f'];
      const labels = ['','Weak','Fair','Good','Strong'];
      const fill = document.getElementById('pw-fill');
      fill.style.width = (score * 25) + '%';
      fill.style.background = colors[score] || '#2d333b';
      document.getElementById('pw-hint').textContent = labels[score] || '';
    });
    document.getElementById('submit-btn')?.addEventListener('click', async () => {
      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('confirm').value;
      document.getElementById('submit-btn').textContent = 'Resetting…';
      const res = await fetch('/reset-password/' + TOKEN, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({password, confirm})
      });
      const d = await res.json();
      if (d.success) {
        document.getElementById('form-section').classList.add('hidden');
        document.getElementById('success-box').classList.remove('hidden');
      } else {
        const b = document.getElementById('alert-box');
        b.textContent = d.message; b.className = 'alert error';
        document.getElementById('submit-btn').textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>
