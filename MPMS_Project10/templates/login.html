<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>MPMS — Secure Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/css/main.css"/>
</head>
<body class="login-page">
  <div class="login-bg"><div class="bg-grid"></div><div class="bg-glow"></div></div>
  <div class="login-container">
    <div class="login-brand">
      <div class="brand-icon"><svg width="48" height="48" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="22" stroke="#e63946" stroke-width="2.5"/><circle cx="24" cy="18" r="6" fill="#e63946"/><path d="M10 38c0-7.7 6.3-14 14-14s14 6.3 14 14" stroke="#e63946" stroke-width="2.5" stroke-linecap="round"/><circle cx="36" cy="14" r="5" fill="#f4a261"/><line x1="36" y1="9" x2="36" y2="7" stroke="#f4a261" stroke-width="2" stroke-linecap="round"/><line x1="36" y1="19" x2="36" y2="21" stroke="#f4a261" stroke-width="2" stroke-linecap="round"/><line x1="41" y1="14" x2="43" y2="14" stroke="#f4a261" stroke-width="2" stroke-linecap="round"/><line x1="29" y1="14" x2="31" y2="14" stroke="#f4a261" stroke-width="2" stroke-linecap="round"/></svg></div>
      <div class="brand-text"><h1>MPMS</h1><p>Missing Person Management System — Pakistan</p></div>
    </div>
    <div class="login-card">
      <div class="login-card-header"><h2>Secure Portal Access</h2><p>Authorized personnel only • PBKDF2-SHA256 encrypted</p></div>
      <div id="alert-box" class="alert hidden"></div>
      <div class="form-group">
        <label>Access Level</label>
        <div class="role-grid">
          <button class="role-btn active" data-role="PUBLIC"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-5 3.6-8 8-8s8 3 8 8"/></svg>Public</button>
          <button class="role-btn" data-role="POLICE"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2 5h5l-4 3 1 5-4-3-4 3 1-5-4-3h5z"/></svg>Police</button>
          <button class="role-btn" data-role="ADMIN"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>Admin</button>
          <button class="role-btn" data-role="LAW_ENFORCEMENT"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Law</button>
        </div>
      </div>
      <div class="form-group">
        <label>Username</label>
        <div class="input-wrap">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-5 3.6-8 8-8s8 3 8 8"/></svg>
          <input type="text" id="username" placeholder="Enter username" autocomplete="username"/>
        </div>
      </div>
      <div class="form-group">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <label style="margin:0">Password</label>
          <a href="/forgot-password" style="font-size:11px;color:var(--blue-light)">Forgot password?</a>
        </div>
        <div class="input-wrap">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          <input type="password" id="password" placeholder="Enter password" autocomplete="current-password"/>
          <button type="button" class="toggle-pw" id="toggle-pw"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <div id="attempts-bar" class="hidden" style="margin-bottom:12px">
        <div style="font-size:11px;color:var(--orange);margin-bottom:4px" id="attempts-text"></div>
        <div style="height:3px;background:var(--bg4);border-radius:3px"><div id="attempts-fill" style="height:100%;background:var(--orange);border-radius:3px;transition:width 0.3s"></div></div>
      </div>
      <button id="login-btn" class="btn-login"><span class="btn-text">Sign In Securely</span><span class="btn-spinner hidden"></span></button>
      <div class="demo-creds" style="margin-top:16px">
        <span>Quick fill:</span>
        <button class="cred-chip" data-u="admin1" data-p="Admin@123" data-r="ADMIN">Admin</button>
        <button class="cred-chip" data-u="officer1" data-p="Police@123" data-r="POLICE">Police</button>
        <button class="cred-chip" data-u="law1" data-p="Law@123" data-r="LAW_ENFORCEMENT">Law</button>
        <button class="cred-chip" data-u="public1" data-p="Public@123" data-r="PUBLIC">Public</button>
      </div>
    </div>
    <div class="login-footer"><span>🔒 PBKDF2-SHA256 Encrypted</span><span>•</span><span>Account lockout after 5 attempts</span><span>•</span><span>v2.0</span></div>
  </div>
  <script src="/static/js/login.js"></script>
</body>
</html>
