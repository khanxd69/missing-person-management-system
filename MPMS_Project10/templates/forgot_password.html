<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>MPMS — Forgot Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/css/main.css"/>
</head>
<body class="login-page">
  <div class="login-bg"><div class="bg-grid"></div><div class="bg-glow"></div></div>
  <div class="login-container">
    <div class="login-brand">
      <div class="brand-icon"><svg width="48" height="48" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="22" stroke="#e63946" stroke-width="2.5"/><circle cx="24" cy="18" r="6" fill="#e63946"/><path d="M10 38c0-7.7 6.3-14 14-14s14 6.3 14 14" stroke="#e63946" stroke-width="2.5" stroke-linecap="round"/></svg></div>
      <div class="brand-text"><h1>MPMS</h1><p>Missing Person Management System</p></div>
    </div>
    <div class="login-card">
      <div class="login-card-header">
        <h2>Forgot Password</h2>
        <p>Enter your email to receive a reset link</p>
      </div>
      <div id="alert-box" class="alert hidden"></div>
      <div id="success-box" class="hidden">
        <div style="text-align:center;padding:20px 0">
          <div style="font-size:48px;margin-bottom:12px">📧</div>
          <h3 style="margin-bottom:8px;font-family:var(--font-heading)">Reset Link Generated</h3>
          <p style="color:var(--text-muted);font-size:13px;margin-bottom:16px">For this demo, your reset link is shown below:</p>
          <div id="reset-link-box" style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:12px;word-break:break-all;color:var(--blue-light);text-align:left;margin-bottom:16px"></div>
          <a id="reset-link-btn" href="#" class="btn-login" style="display:inline-flex;text-decoration:none">Go to Reset Page →</a>
        </div>
      </div>
      <div id="form-section">
        <div class="form-group">
          <label>Registered Email</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,12 2,6"/></svg>
            <input type="email" id="email" placeholder="your@email.com"/>
          </div>
        </div>
        <button id="submit-btn" class="btn-login">Send Reset Link</button>
      </div>
      <div style="text-align:center;margin-top:16px">
        <a href="/login" style="font-size:13px;color:var(--text-muted)">← Back to Login</a>
      </div>
    </div>
  </div>
  <script>
    document.getElementById('submit-btn').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      if (!email) { showAlert('Please enter your email address'); return; }
      document.getElementById('submit-btn').textContent = 'Sending…';
      const res = await fetch('/forgot-password', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({email})
      });
      const d = await res.json();
      if (d.success) {
        document.getElementById('form-section').classList.add('hidden');
        document.getElementById('success-box').classList.remove('hidden');
        if (d.reset_link) {
          document.getElementById('reset-link-box').textContent = d.reset_link;
          document.getElementById('reset-link-btn').href = d.reset_link;
        }
      } else {
        showAlert(d.message || 'Something went wrong');
        document.getElementById('submit-btn').textContent = 'Send Reset Link';
      }
    });
    function showAlert(msg) {
      const b = document.getElementById('alert-box');
      b.textContent = msg; b.className = 'alert error';
    }
  </script>
</body>
</html>
